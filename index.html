<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opelia - Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        opelia: {
                            dark: '#5B446D',
                            light: '#EADFF6',
                            white: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        italiana: ['Italiana', 'serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Italiana&family=Poppins:wght@300;400;500;600;700&display=swap');
        
        .gradient-bg {
            background: linear-gradient(135deg, #EADFF6 0%, #FFFFFF 50%, #F5E6FA 100%);
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .pulse-slow {
            animation: pulse 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="font-poppins gradient-bg min-h-screen flex items-center justify-center p-6">

    <div class="max-w-4xl w-full">
        <!-- Main Container -->
        <div class="bg-white/80 backdrop-blur-lg rounded-[3rem] shadow-2xl overflow-hidden">
            <div class="flex flex-col lg:flex-row">
                
                <!-- Left Side - Content -->
                <div class="lg:w-1/2 p-12 lg:p-16 flex flex-col justify-center">
                    <!-- Logo -->
                    <div class="mb-8">
                        <h1 class="text-5xl font-italiana text-opelia-dark">Opelia.</h1>
                    </div>

                    <!-- Status Badge -->
                    <div class="inline-flex items-center gap-2 bg-opelia-light px-4 py-2 rounded-full w-fit mb-6">
                        <span class="w-2 h-2 bg-opelia-dark rounded-full pulse-slow"></span>
                        <span class="text-opelia-dark text-sm font-medium font-poppins">Under Maintenance</span>
                    </div>

                    <!-- Main Heading -->
                    <h2 class="text-4xl lg:text-5xl font-italiana text-opelia-dark mb-6 leading-tight">
                        We'll Be Back<br>
                        <span class="italic text-transparent bg-clip-text bg-gradient-to-r from-opelia-dark to-purple-600">
                            Very Soon!
                        </span>
                    </h2>

                    <!-- Description -->
                    <p class="text-gray-600 text-lg mb-8 font-poppins font-light leading-relaxed">
                        We're currently making some exciting improvements to serve you better. Thank you for your patience!
                    </p>

                    <!-- Contact Info -->
                    <div class="space-y-4 mb-8">
                        <div class="flex items-center gap-3 text-gray-700">
                            <div class="w-10 h-10 bg-opelia-light rounded-full flex items-center justify-center text-opelia-dark">
                                <i class="fab fa-whatsapp"></i>
                            </div>
                            <span class="font-poppins">+94 74 138 7363</span>
                        </div>
                        <div class="flex items-center gap-3 text-gray-700">
                            <div class="w-10 h-10 bg-opelia-light rounded-full flex items-center justify-center text-opelia-dark">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <span class="font-poppins">hello@opelia.com</span>
                        </div>
                    </div>

                    <!-- Social Links -->
                    <div class="flex gap-4">
                        <a href="#" class="w-12 h-12 bg-opelia-dark text-white rounded-full flex items-center justify-center hover:bg-opacity-90 transition shadow-lg hover:-translate-y-1 transform">
                            <i class="fab fa-instagram text-xl"></i>
                        </a>
                        <a href="#" class="w-12 h-12 bg-opelia-dark text-white rounded-full flex items-center justify-center hover:bg-opacity-90 transition shadow-lg hover:-translate-y-1 transform">
                            <i class="fab fa-facebook-f text-xl"></i>
                        </a>
                        <a href="#" class="w-12 h-12 bg-opelia-dark text-white rounded-full flex items-center justify-center hover:bg-opacity-90 transition shadow-lg hover:-translate-y-1 transform">
                            <i class="fab fa-twitter text-xl"></i>
                        </a>
                    </div>
                </div>

                <!-- Right Side - Image/Illustration -->
                <div class="lg:w-1/2 bg-gradient-to-br from-opelia-dark to-purple-700 p-12 lg:p-16 flex items-center justify-center relative overflow-hidden">
                    <!-- Decorative Circles -->
                    <div class="absolute top-10 right-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                    <div class="absolute bottom-10 left-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-60 h-60 bg-white/5 rounded-full blur-2xl"></div>
                    
                    <!-- Main Illustration -->
                    <div class="relative z-10 text-center text-white">
                        <div class="floating mb-8">
                            <i class="fas fa-tools text-8xl opacity-90"></i>
                        </div>
                        <div class="space-y-2">
                            <div class="text-6xl font-italiana">24h</div>
                            <div class="text-white/80 font-poppins text-sm">Estimated Time</div>
                        </div>
                    </div>

                    <!-- Floating Elements -->
                    <div class="absolute top-20 left-8 bg-white/20 backdrop-blur-sm rounded-2xl p-3 floating" style="animation-delay: 1s;">
                        <i class="fas fa-shopping-bag text-2xl text-white"></i>
                    </div>
                    <div class="absolute bottom-20 right-8 bg-white/20 backdrop-blur-sm rounded-2xl p-3 floating" style="animation-delay: 2s;">
                        <i class="fas fa-gem text-2xl text-white"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Text -->
        <p class="text-center text-gray-500 mt-8 font-poppins text-sm">
            © 2024 Opelia. All rights reserved. We appreciate your patience! 💜
        </p>
    </div>

</body>
</html>
